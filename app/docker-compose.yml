name: meraki_lead_scoring

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meraki_lead_scoring}
      POSTGRES_USER: ${POSTGRES_USER:-meraki}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meraki}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d

  backend:
    build:
      context: .
    depends_on:
      - postgres
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_HOST: ${APP_HOST:-0.0.0.0}
      APP_PORT: ${APP_PORT:-8000}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-meraki_lead_scoring}
      POSTGRES_USER: ${POSTGRES_USER:-meraki}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meraki}
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-5}
    ports:
      - "${APP_PORT:-8000}:8000"

volumes:
  postgres_data:
